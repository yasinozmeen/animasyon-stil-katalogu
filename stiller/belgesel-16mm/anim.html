<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── belgesel-16mm · eski siyah-beyaz belgesel ─────────────────────────────
// Geri sayım kuşağı (3, 2 + bip) → yazı kartı "Sözün İzinde" → kare kayması → stüdyoda eski şerit mikrofon (yavaş yaklaşma,
// ışık huzmesinde toz) → ek yeri parlaması → yazı kartı "Her söz, bir cesaretle başlar." → iris kapanışlı "SON".
const W = 1920, H = 1080, DUR = 10.0;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const S = mk(W, H), sx = S.getContext('2d');
const S2 = mk(W, H), sx2 = S2.getContext('2d');
let GRAIN = [], VIG, STUDIO, MIC, TITLE1, TITLE2, FIN;
const INK = '#e9e7df', DARK = '#0e0e0d';
const SERIF = '"Old Standard TT"';
// kurgu (saniye)
const T = { lead0: 0.12, lead2: 0.82, leadEnd: 1.5, t1: 1.72, slip: 4.1, slipEnd: 4.32, shotEnd: 7.2, t2: 7.2, fin: 8.95, end: 10.0 };

// ── yazı kartı ──
function ornament(x, cx, cy, w) {
  x.save(); x.strokeStyle = INK; x.fillStyle = INK; x.lineWidth = 2;
  x.beginPath(); x.moveTo(cx - w / 2, cy); x.lineTo(cx - 22, cy); x.moveTo(cx + 22, cy); x.lineTo(cx + w / 2, cy); x.stroke();
  x.beginPath(); x.moveTo(cx, cy - 11); x.lineTo(cx + 11, cy); x.lineTo(cx, cy + 11); x.lineTo(cx - 11, cy); x.closePath(); x.fill();
  [-1, 1].forEach(s => { x.beginPath(); x.arc(cx + s * (w / 2 + 8), cy, 4, 0, Math.PI * 2); x.fill(); });
  x.restore();
}
function cardFrame(x) {
  x.fillStyle = DARK; x.fillRect(0, 0, W, H);
  x.strokeStyle = INK; x.lineWidth = 3; x.strokeRect(120, 90, W - 240, H - 180);
  x.lineWidth = 1.5; x.strokeRect(138, 108, W - 276, H - 216);
  // köşe süsleri (art deco basamaklar)
  [[120, 90, 1, 1], [W - 120, 90, -1, 1], [120, H - 90, 1, -1], [W - 120, H - 90, -1, -1]].forEach(([px, py, sx_, sy]) => {
    x.save(); x.translate(px, py); x.scale(sx_, sy); x.fillStyle = INK;
    x.fillRect(-8, -8, 34, 5); x.fillRect(-8, -8, 5, 34); x.fillRect(30, 16, 22, 3); x.fillRect(16, 30, 3, 22);
    x.beginPath(); x.moveTo(34, 34); x.lineTo(42, 42); x.lineTo(34, 50); x.lineTo(26, 42); x.closePath(); x.fill();
    x.restore();
  });
}
function buildTitle1() {
  const c = mk(W, H), x = c.getContext('2d'); cardFrame(x);
  x.fillStyle = INK; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  x.font = `400 38px ${SERIF}`; x.letterSpacing = '14px'; x.fillText('BİR KONUŞMA BELGESELİ', 967, 330);
  ornament(x, 960, 392, 520);
  x.letterSpacing = '2px'; x.font = `700 168px ${SERIF}`; x.fillText('Sözün İzinde', 960, 590);
  ornament(x, 960, 680, 380);
  x.font = `italic 400 46px ${SERIF}`; x.letterSpacing = '4px'; x.fillText('Birinci Bölüm', 960, 780);
  x.font = `400 30px ${SERIF}`; x.letterSpacing = '10px'; x.fillText('— MCMLII —', 965, 880);
  return c;
}
function buildTitle2() {
  const c = mk(W, H), x = c.getContext('2d'); cardFrame(x);
  x.fillStyle = INK; x.textAlign = 'center';
  x.font = `italic 400 96px ${SERIF}`; x.letterSpacing = '1px';
  x.fillText('“Her söz,', 960, 470); x.fillText('bir cesaretle başlar.”', 960, 600);
  ornament(x, 960, 720, 300);
  return c;
}
function buildFin() {
  const c = mk(W, H), x = c.getContext('2d'); cardFrame(x);
  x.fillStyle = INK; x.textAlign = 'center';
  x.font = `700 210px ${SERIF}`; x.letterSpacing = '30px'; x.fillText('SON', 975, 610);
  ornament(x, 960, 700, 460);
  return c;
}

// ── stüdyo + eski şerit mikrofon (bir kez çizilir, yaklaşma kamerayla yapılır) ──
function buildStudio() {
  const c = mk(W, H), x = c.getContext('2d');
  // duvar: koyu, dikey akustik paneller
  x.fillStyle = '#2a2a28'; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 14; i++) { x.fillStyle = i % 2 ? '#2f2f2c' : '#262624'; x.fillRect(i * 140, 0, 140, 760); x.fillStyle = '#1b1b1a'; x.fillRect(i * 140, 0, 4, 760); }
  // zemin (ahşap, perspektif)
  const fg = x.createLinearGradient(0, 760, 0, H); fg.addColorStop(0, '#3a3a36'); fg.addColorStop(1, '#161615');
  x.fillStyle = fg; x.fillRect(0, 760, W, H - 760);
  x.strokeStyle = 'rgba(0,0,0,0.35)'; x.lineWidth = 2;
  for (let i = -20; i < 30; i++) { x.beginPath(); x.moveTo(960 + i * 40, 760); x.lineTo(960 + i * 180, H); x.stroke(); }
  x.fillStyle = '#121211'; x.fillRect(0, 752, W, 10);
  // spot ışığı havuzu
  const g = x.createRadialGradient(1010, 520, 40, 1010, 560, 760);
  g.addColorStop(0, 'rgba(255,255,250,0.55)'); g.addColorStop(0.5, 'rgba(255,255,250,0.14)'); g.addColorStop(1, 'rgba(255,255,250,0)');
  x.globalCompositeOperation = 'screen'; x.fillStyle = g; x.fillRect(0, 0, W, H);
  const fl = x.createRadialGradient(960, 930, 20, 960, 930, 420); fl.addColorStop(0, 'rgba(255,255,250,0.35)'); fl.addColorStop(1, 'rgba(255,255,250,0)');
  x.fillStyle = fl; x.beginPath(); x.ellipse(960, 930, 460, 110, 0, 0, Math.PI * 2); x.fill();
  x.globalCompositeOperation = 'source-over';
  // ayak gölgesi
  x.fillStyle = 'rgba(0,0,0,0.55)'; x.beginPath(); x.ellipse(1000, 942, 210, 34, 0, 0, Math.PI * 2); x.fill();
  // stand
  const metal = (x0, x1) => { const m = x.createLinearGradient(x0, 0, x1, 0); m.addColorStop(0, '#3b3b38'); m.addColorStop(0.35, '#d8d6cc'); m.addColorStop(0.55, '#8a8983'); m.addColorStop(1, '#262624'); return m; };
  x.fillStyle = metal(946, 974); x.fillRect(946, 560, 28, 360);
  x.fillStyle = metal(930, 990); x.fillRect(930, 700, 60, 26); // sıkma halkası
  // ağır taban
  const bg = x.createLinearGradient(0, 900, 0, 950); bg.addColorStop(0, '#9a9890'); bg.addColorStop(1, '#1c1c1b');
  x.fillStyle = bg; x.beginPath(); x.ellipse(960, 925, 170, 34, 0, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#d6d4ca'; x.beginPath(); x.ellipse(960, 915, 150, 24, 0, Math.PI, Math.PI * 2); x.fill();
  x.fillStyle = metal(900, 1020); x.beginPath(); x.ellipse(960, 912, 60, 14, 0, 0, Math.PI * 2); x.fill();
  // çatal (yoke)
  x.lineWidth = 16; x.strokeStyle = metal(820, 1100); x.lineCap = 'round';
  x.beginPath(); x.moveTo(960, 575); x.lineTo(960, 560); x.moveTo(832, 380); x.lineTo(832, 520); x.quadraticCurveTo(832, 560, 872, 560); x.lineTo(1048, 560); x.quadraticCurveTo(1088, 560, 1088, 520); x.lineTo(1088, 380); x.stroke();
  // mikrofon gövdesi: yuvarlak köşeli "hap" kapsül
  const bx = 850, by = 150, bw = 220, bh = 430, r = 108;
  x.save(); x.beginPath(); x.roundRect(bx, by, bw, bh, r); x.clip();
  const body = x.createLinearGradient(bx, 0, bx + bw, 0);
  body.addColorStop(0, '#1d1d1b'); body.addColorStop(0.18, '#9c9a92'); body.addColorStop(0.34, '#f2f0e6'); body.addColorStop(0.5, '#a9a79e'); body.addColorStop(0.8, '#4a4945'); body.addColorStop(1, '#141413');
  x.fillStyle = body; x.fillRect(bx, by, bw, bh);
  // yatay ızgara kaburgaları
  for (let yy = by + 18; yy < by + bh - 10; yy += 13) {
    if (yy > by + bh / 2 - 40 && yy < by + bh / 2 + 40) continue;
    x.fillStyle = 'rgba(0,0,0,0.55)'; x.fillRect(bx, yy, bw, 5);
    x.fillStyle = 'rgba(255,255,245,0.12)'; x.fillRect(bx, yy + 5, bw, 2);
  }
  // orta kuşak + boş plaka
  const band = x.createLinearGradient(bx, 0, bx + bw, 0);
  band.addColorStop(0, '#2a2a28'); band.addColorStop(0.3, '#e9e7dc'); band.addColorStop(0.55, '#77766f'); band.addColorStop(1, '#161615');
  x.fillStyle = band; x.fillRect(bx, by + bh / 2 - 38, bw, 76);
  x.fillStyle = 'rgba(0,0,0,0.6)'; x.fillRect(bx, by + bh / 2 - 38, bw, 3); x.fillRect(bx, by + bh / 2 + 35, bw, 3);
  x.fillStyle = '#1a1a19'; x.beginPath(); x.roundRect(915, by + bh / 2 - 13, 90, 26, 4); x.fill();
  x.strokeStyle = '#cfcdc2'; x.lineWidth = 2; x.stroke();
  x.fillStyle = '#9a988f'; for (let i = 0; i < 5; i++) x.fillRect(928 + i * 15, by + bh / 2 - 2, 9, 4);
  x.restore();
  // kenar çizgisi ve parlama
  x.strokeStyle = 'rgba(0,0,0,0.8)'; x.lineWidth = 4; x.beginPath(); x.roundRect(bx, by, bw, bh, r); x.stroke();
  x.strokeStyle = 'rgba(255,255,250,0.5)'; x.lineWidth = 3; x.beginPath(); x.arc(bx + r, by + r, r - 6, Math.PI * 1.1, Math.PI * 1.45); x.stroke();
  // çatal vidaları
  [832, 1088].forEach(px_ => { x.fillStyle = '#2a2a28'; x.fillRect(px_ - 16, 350, 32, 30); x.fillStyle = '#8f8d85'; for (let k = 0; k < 6; k++) x.fillRect(px_ - 14 + k * 5, 352, 2, 26); x.fillStyle = '#d9d7cc'; x.fillRect(px_ - 16, 350, 32, 3); });
  // kablo
  x.strokeStyle = '#111'; x.lineWidth = 9; x.beginPath(); x.moveTo(975, 860); x.bezierCurveTo(1120, 940, 1300, 900, 1500, 1000); x.lineTo(1700, 1090); x.stroke();
  return c;
}

// ── film dokusu ──
function buildGrain(seed) {
  const w = 960, h = 540, c = mk(w, h), x = c.getContext('2d'), d = x.createImageData(w, h), r = rng(seed);
  for (let i = 0; i < w * h; i++) { const v = 128 + (r() + r() + r() + r() - 2) * 170; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = 255; }
  x.putImageData(d, 0, 0); return c;
}
function buildVig() {
  const c = mk(W, H), x = c.getContext('2d');
  const g = x.createRadialGradient(W / 2, H / 2, H * 0.28, W / 2, H / 2, H * 1.02);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.7, 'rgba(0,0,0,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0.88)');
  x.fillStyle = g; x.fillRect(0, 0, W, H); return c;
}
function noise1(t, seed) { // yumuşak 1B gürültü
  const i = Math.floor(t), f = t - i, a = rng(i * 131 + seed)(), b = rng((i + 1) * 131 + seed)();
  return lerp(a, b, f * f * (3 - 2 * f)) * 2 - 1;
}

// ── sahneler ──
function leader(x, t) {
  const n = t < T.lead2 ? 3 : 2, t0 = n === 3 ? T.lead0 : T.lead2, u = seg(t, t0, t0 + (T.lead2 - T.lead0));
  x.fillStyle = '#b3b2ac'; x.fillRect(0, 0, W, H);
  // süpürme (saat yönünde koyu dilim)
  x.fillStyle = '#4a4946'; x.beginPath(); x.moveTo(960, 540); x.arc(960, 540, 1400, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * u); x.closePath(); x.fill();
  x.strokeStyle = '#f4f3ee'; x.lineWidth = 7;
  x.beginPath(); x.arc(960, 540, 330, 0, Math.PI * 2); x.stroke();
  x.beginPath(); x.arc(960, 540, 400, 0, Math.PI * 2); x.stroke();
  x.lineWidth = 4; x.beginPath(); x.moveTo(0, 540); x.lineTo(W, 540); x.moveTo(960, 0); x.lineTo(960, H); x.stroke();
  x.fillStyle = '#121211'; x.font = `700 460px ${SERIF}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(String(n), 960, 560);
}
function studio(x, t) {
  const u = seg(t, T.slip, T.shotEnd + 0.2);
  const z = lerp(1.0, 1.14, eInOut(u));
  x.save(); x.translate(960, 470); x.scale(z, z); x.translate(-960 + lerp(-14, 10, u), -470);
  x.drawImage(STUDIO, 0, 0);
  // ışık huzmesi ve içinde süzülen toz
  x.globalCompositeOperation = 'screen';
  const beam = x.createLinearGradient(640, -100, 1050, 700);
  beam.addColorStop(0, 'rgba(255,255,250,0.22)'); beam.addColorStop(1, 'rgba(255,255,250,0)');
  x.fillStyle = beam; x.beginPath(); x.moveTo(470, -60); x.lineTo(760, -60); x.lineTo(1400, 900); x.lineTo(760, 900); x.closePath(); x.fill();
  const r = rng(77);
  for (let i = 0; i < 70; i++) {
    const bx = 560 + r() * 700, by = r() * 900, sp = 8 + r() * 18, ph = r() * 6.28;
    const px_ = bx + Math.sin(t * 0.7 + ph) * 30 + (by / 900) * 400, py = (by + t * sp) % 900;
    const inBeam = (px_ - 470 - (py + 60) * 0.72) > -60 && (px_ - 760 - (py + 60) * 0.66) < 60;
    if (!inBeam) continue;
    x.fillStyle = `rgba(255,255,250,${0.25 + 0.5 * r()})`; x.beginPath(); x.arc(px_, py, 1 + r() * 2.2, 0, Math.PI * 2); x.fill();
  }
  x.globalCompositeOperation = 'source-over';
  x.restore();
  // belgesel alt yazısı (daktilo, harf harf)
  const cap = 'Kayıt stüdyosu, sabah 06.40';
  const n = Math.floor(seg(t, T.slipEnd + 0.5, T.slipEnd + 1.6) * cap.length);
  if (n > 0) {
    const a = 1 - seg(t, T.shotEnd - 0.35, T.shotEnd - 0.05);
    x.save(); x.globalAlpha = a; x.font = '400 40px "Courier Prime"'; x.fillStyle = INK; x.textAlign = 'left'; x.textBaseline = 'alphabetic';
    x.fillText(cap.slice(0, n), 170, 960);
    x.fillRect(170, 978, 60 * seg(t, T.slipEnd + 0.3, T.slipEnd + 0.6), 3);
    x.restore();
  }
}
function card(x, img, t, t0, t1) {
  // yazı kartı: pozlama yavaşça açılır, sonda kararır
  const z = 1 + 0.035 * seg(t, t0, t0 + 3); // kamerada hafif yaklaşma
  x.fillStyle = DARK; x.fillRect(0, 0, W, H);
  x.drawImage(img, W / 2 - W * z / 2, H / 2 - H * z / 2, W * z, H * z);
  const fin = seg(t, t0, t0 + 0.45), fout = seg(t, t1 - 0.3, t1);
  const k = (1 - eOut(fin)) + fout;
  if (k > 0) { x.fillStyle = `rgba(0,0,0,${clamp(k)})`; x.fillRect(0, 0, W, H); }
}
function sceneAt(x, t) {
  if (t < T.lead0) { x.fillStyle = '#000'; x.fillRect(0, 0, W, H); return; }
  if (t < T.leadEnd) return leader(x, t);
  if (t < T.t1) { x.fillStyle = '#000'; x.fillRect(0, 0, W, H); return; }
  if (t < T.slip) return card(x, TITLE1, t, T.t1, 99);
  if (t < T.shotEnd) return studio(x, t);
  if (t < T.fin) return card(x, TITLE2, t, T.t2, T.fin + 0.2);
  return card(x, FIN, t, T.fin, 99);
}

function render(t) {
  const f = Math.floor(t * 30), r = rng(f * 977 + 13);
  // kare kayması: çıkan kare aşağı kayar, arada kare çizgisi, üstten yenisi girer
  if (t >= T.slip && t < T.slipEnd) {
    const u = eInOut(seg(t, T.slip, T.slipEnd)), bar = 90, off = u * (H + bar);
    sceneAt(sx2, T.slip - 0.01);
    sx.fillStyle = '#050505'; sx.fillRect(0, 0, W, H);
    sx.drawImage(S2, 0, off);
    sceneAt(sx2, T.slipEnd + 0.01);
    sx.drawImage(S2, 0, off - H - bar);
    // dikey sürtünme bulanıklığı
    sx.globalAlpha = 0.35; sx.drawImage(S, 0, -24); sx.drawImage(S, 0, 24); sx.globalAlpha = 1;
  } else sceneAt(sx, t);

  // kapanış irisi (sessiz film)
  if (t > T.fin + 0.3) {
    const u = eInOut(seg(t, T.fin + 0.3, T.end - 0.15)), rr = lerp(1150, 0, u);
    sx.save(); sx.fillStyle = '#000'; sx.beginPath(); sx.rect(0, 0, W, H); sx.arc(960, 560, Math.max(0.1, rr), 0, Math.PI * 2, true); sx.fill('evenodd'); sx.restore();
  }

  // kopya: kapı titremesi (gate weave) + hafif yumuşaklık
  const wx = noise1(t * 3, 1) * 3 + (r() - 0.5) * 1.2, wy = noise1(t * 2.3, 2) * 4 + (r() - 0.5) * 1.5;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.filter = 'blur(1.1px) grayscale(1) contrast(1.12)';
  ctx.drawImage(S, wx, wy);
  ctx.filter = 'none';

  // pozlama titremesi
  const flick = 0.07 * noise1(t * 9, 3) + (r() - 0.5) * 0.06;
  if (flick > 0) { ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = `rgba(255,255,255,${flick})`; }
  else { ctx.globalCompositeOperation = 'multiply'; const v = Math.round(255 * (1 + flick)); ctx.fillStyle = `rgb(${v},${v},${v})`; }
  ctx.fillRect(0, 0, W, H);

  // gren
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.42;
  ctx.drawImage(GRAIN[f % GRAIN.length], -r() * 80, -r() * 80, W * 2 + 160, H * 2 + 160);
  ctx.globalAlpha = 0.25; ctx.drawImage(GRAIN[(f + 3) % GRAIN.length], -r() * 400, -r() * 300, W + 400, H + 300);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // dikey çizikler: birkaç saniye boyunca yavaşça gezinir
  const lines = [[0.31, 0.0, 6.0], [0.72, 1.8, 9.5], [0.55, 4.6, 8.0], [0.18, 7.0, 10]];
  lines.forEach(([x0, a, b], i) => {
    if (t < a || t > b) return;
    const xx = (x0 + noise1(t * 0.6, 10 + i) * 0.03) * W, al = 0.18 + 0.25 * Math.abs(noise1(t * 12, 20 + i));
    ctx.fillStyle = `rgba(245,245,240,${al})`; ctx.fillRect(xx, 0, 1.6 + (i % 2), H);
    if (r() < 0.3) { ctx.fillStyle = `rgba(0,0,0,${al})`; ctx.fillRect(xx + 3, H * r(), 1.2, H * 0.4); }
  });
  // toz, lif, kıl: tek karelik
  const nd = 3 + Math.floor(r() * 8);
  for (let i = 0; i < nd; i++) {
    const white = r() < 0.55, px_ = r() * W, py = r() * H, s = 1.5 + r() * r() * 9;
    ctx.fillStyle = white ? `rgba(250,250,245,${0.5 + r() * 0.4})` : `rgba(0,0,0,${0.55 + r() * 0.4})`;
    ctx.beginPath(); ctx.ellipse(px_, py, s, s * (0.5 + r() * 0.6), r() * 3, 0, Math.PI * 2); ctx.fill();
  }
  if (r() < 0.22) { // kıl
    const px_ = r() * W, py = r() * H, L = 40 + r() * 120;
    ctx.strokeStyle = r() < 0.5 ? 'rgba(0,0,0,0.7)' : 'rgba(250,250,245,0.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(px_, py); ctx.bezierCurveTo(px_ + L * r(), py - L * 0.5, px_ - L * 0.3, py + L * r(), px_ + L * (r() - 0.5), py + L); ctx.stroke();
  }
  // ek yeri parlaması (yazı kartı 2'ye kesme) ve geri sayım sonu flaşı
  const flash = [[T.shotEnd, 1 / 30, 0.85], [T.leadEnd, 1 / 30, 0.6]].find(([a, d]) => t >= a && t < a + d);
  if (flash) {
    ctx.fillStyle = `rgba(255,255,250,${flash[2]})`; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, H * 0.18, W, 5);
  }
  // kenar kararması + kaldırılmış siyahlar
  ctx.drawImage(VIG, 0, 0);
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgb(14,14,13)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
}

window.ready = (async () => {
  await Promise.all([`700 100px ${SERIF}`, `400 100px ${SERIF}`, `italic 400 100px ${SERIF}`, '400 40px "Courier Prime"'].map(f => document.fonts.load(f, 'Sözün İzinde ğşıçÇŞİ—“”')));
  await document.fonts.ready;
  for (let i = 0; i < 8; i++) GRAIN.push(buildGrain(i * 37 + 5));
  VIG = buildVig(); STUDIO = buildStudio(); TITLE1 = buildTitle1(); TITLE2 = buildTitle2(); FIN = buildFin();
  return true;
})();
window.draw = ({ t }) => { render(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
window.events = () => [{ t: T.lead2, k: 'pop' }, { t: T.t1 + 0.1, k: 'motif' }, { t: T.slip, k: 'slip' }, { t: T.t2 + 0.05, k: 'chord' }, { t: T.fin + 0.05, k: 'low' }];
</script>
